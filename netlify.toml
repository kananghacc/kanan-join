[build]
  publish = "dist"
  command = "./build.sh"
  base = "."

[build.environment]
  NODE_VERSION = "18"

# Bundle shared/submit-lead-core.js into the CRM proxy function
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.submit-lead]
  included_files = ["shared/submit-lead-core.js"]

# Static HTML deployment - serves static HTML from dist directory

# Redirect www.join.kanan.co to join.kanan.co
[[redirects]]
  from = "https://www.join.kanan.co/*"
  to = "https://join.kanan.co/:splat"
  status = 301
  force = true

# Disable ielts-new (return 410 Gone)
[[redirects]]
  from = "/ielts-new"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/ielts-new/*"
  to = "/404.html"
  status = 410


# Redirect root to IELTS Chennai app (main app)
[[redirects]]
  from = "/"
